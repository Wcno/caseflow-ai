<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROTOTIPO — CaseFlow AI</title>
    <style>
      :root{font-family:Inter,Segoe UI,sans-serif;color:#10233f;background:#edf3f4}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}.shell{min-height:100vh}.top{height:72px;background:#09233c;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-weight:800;font-size:22px}.brand span{color:#4dd4c6}.local{font-size:12px;padding:8px 12px;border:1px solid #3b756f;border-radius:999px;background:#0c3b46}.page{padding:34px 5vw 100px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#537070;font-weight:800}.title{font-size:34px;margin:7px 0 24px}.card{background:white;border:1px solid #d7e2e4;border-radius:18px;box-shadow:0 12px 34px #173f4b12}.pad{padding:24px}.tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid #cddcde;background:#f7fafb;border-radius:10px;padding:10px 14px}.tab.active{color:white;background:#0b7d72;border-color:#0b7d72}.narrative{width:100%;min-height:150px;border:1px solid #cbd9db;border-radius:12px;padding:16px;resize:none}.primary{border:0;background:#ef7b45;color:#fff;border-radius:11px;padding:13px 19px;font-weight:800}.secondary{border:1px solid #b8cbcd;background:white;color:#173d46;border-radius:11px;padding:12px 16px}.meta{font-size:12px;color:#668084}.split{display:grid;grid-template-columns:minmax(320px,.78fr) minmax(480px,1.22fr);gap:22px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{padding:16px;border-radius:12px;background:#eff8f6}.metric strong{display:block;margin-top:6px}.missing{background:#fff3eb;border-color:#f2c3a9}.procedure{grid-column:1/-1}.steps{display:flex;gap:7px;margin-bottom:22px}.step{flex:1;height:7px;border-radius:99px;background:#d5e1e2}.step.done{background:#15a092}.flow{max-width:860px;margin:auto}.flow .card{margin-bottom:18px}.summary{display:flex;justify-content:space-between;gap:24px;align-items:center}.cockpit{display:grid;grid-template-columns:240px 1fr;gap:0;min-height:calc(100vh - 72px)}.rail{background:#123349;color:white;padding:30px 20px}.rail-item{padding:12px;border-radius:9px;margin:5px 0}.rail-item.active{background:#1a5260}.work{padding:34px}.work-grid{display:grid;grid-template-columns:1fr 340px;gap:18px}.queue{font-size:13px;border-top:1px solid #e2e9e9;padding:12px 0}.switcher{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#071b2d;color:#fff;border-radius:999px;padding:8px;box-shadow:0 10px 30px #0004}.switcher button{border:0;background:#173c55;color:white;width:34px;height:34px;border-radius:50%}.switcher strong{min-width:180px;text-align:center;font-size:13px}@media(max-width:850px){.split,.work-grid{grid-template-columns:1fr}.cockpit{grid-template-columns:1fr}.rail{display:none}.result-grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <!-- Tres variantes estructurales del escritorio, seleccionables con ?variant=A|B|C. -->
    <div id="app"></div>
    <div class="switcher"><button id="prev">←</button><strong id="label"></strong><button id="next">→</button></div>
    <script>
      const sample = 'Retiré B/.120.00 en un cajero de Vía España. La cuenta fue debitada, pero el cajero no entregó el efectivo.';
      const header = '<header class="top"><div class="brand">CaseFlow <span>AI</span></div><div class="local">● QVAC local · Sin nube</div></header>';
      const intake = `<div class="card pad"><div class="eyebrow">Nuevo reclamo</div><div class="tabs"><button class="tab active">Texto</button><button class="tab">Grabar voz</button><button class="tab">Subir audio</button></div><textarea class="narrative">${sample}</textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><span class="meta">Datos sintéticos para demostración</span><button class="primary">Preparar reclamo →</button></div></div>`;
      const result = `<div class="card pad"><div style="display:flex;justify-content:space-between"><div><div class="eyebrow">Expediente preparado</div><h2 style="margin:7px 0">Retiro debitado sin efectivo</h2></div><button class="secondary">Editar</button></div><div class="result-grid"><div class="metric"><span class="meta">Producto</span><strong>Tarjeta de débito</strong></div><div class="metric"><span class="meta">Área responsable</span><strong>Operaciones de Cajeros y Disputas</strong></div><div class="metric missing"><span class="meta">Información faltante</span><strong>ID del cajero · Hora aproximada</strong></div><div class="metric"><span class="meta">Tiempo local</span><strong>00:34.8</strong></div><div class="metric procedure"><span class="meta">Procedimiento sintético · ATM-001</span><strong>Retiro debitado sin entrega de efectivo</strong><p>Validar el débito, identificar terminal y escalar la conciliación del cajero.</p></div></div></div>`;
      const variants = {
        A: {name:'Mesa dividida', html:`${header}<main class="page"><div class="eyebrow">Preparación asistida</div><h1 class="title">Convierta una narrativa en un caso listo para revisar.</h1><div class="steps"><i class="step done"></i><i class="step done"></i><i class="step done"></i><i class="step"></i></div><div class="split">${intake}${result}</div></main>`},
        B: {name:'Flujo guiado', html:`${header}<main class="page flow"><div class="eyebrow">Paso 1 de 3</div><h1 class="title">Capture el reclamo</h1>${intake}<div class="card pad summary"><div><div class="eyebrow">Vista previa</div><h2 style="margin:6px 0">La IA local preparará clasificación, procedimiento y respuesta.</h2><span class="meta">El colaborador conserva el control antes de guardar.</span></div><button class="secondary">Ver cómo funciona</button></div></main>`},
        C: {name:'Cabina operativa', html:`${header}<div class="cockpit"><aside class="rail"><div class="eyebrow" style="color:#78b8b3">Operación</div><div class="rail-item active">Nuevo reclamo</div><div class="rail-item">Historial local</div><div class="rail-item">Diagnóstico</div><div style="margin-top:35px" class="meta">Cola local</div><div class="queue">ATM-001 · Listo</div><div class="queue">DIG-003 · Revisión</div></aside><main class="work"><div class="eyebrow">Cabina de reclamos</div><h1 class="title">Preparación y control</h1><div class="work-grid"><div>${intake}</div><div>${result}</div></div></main></div>`}
      };
      const keys=['A','B','C']; let current=new URLSearchParams(location.search).get('variant')||'A'; if(!keys.includes(current)) current='A';
      function render(){document.querySelector('#app').innerHTML=variants[current].html;document.querySelector('#label').textContent=`${current} · ${variants[current].name}`;history.replaceState(null,'',`?variant=${current}`)}
      function move(delta){current=keys[(keys.indexOf(current)+delta+keys.length)%keys.length];render()}
      document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);
      addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});render();
    </script>
  </body>
</html>
